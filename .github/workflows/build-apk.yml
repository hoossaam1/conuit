name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Build Web Assets
        run: |
          npm install
          npx cap sync android || (npx cap add android && npx cap sync android)

      - name: Generate Permanent Keystore on the Fly
        run: |
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/release.jks -alias conduitkey -keyalg RSA -keysize 2048 -validity 10000 -storepass MySecretPass123 -keypass MySecretPass123 -dname "CN=Hossam,O=App,C=EG"

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/release.jks" \
            -Pandroid.injected.signing.store.password="MySecretPass123" \
            -Pandroid.injected.signing.key.alias="conduitkey" \
            -Pandroid.injected.signing.key.password="MySecretPass123" \
            -PversionCode=${{ github.run_number }} \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
