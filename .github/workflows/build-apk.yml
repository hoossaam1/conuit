name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore & Print Base64
        run: |
          keytool -genkey -v -keystore release.jks -alias conduitkey -keyalg RSA -keysize 2048 -validity 10000 -storepass MySecretPass123 -keypass MySecretPass123 -dname "CN=Hossam,O=App,C=EG"
          echo "=== COPY THE BASE64 STRING BELOW ==="
          base64 -w 0 release.jks
          echo ""
          echo "===================================="
